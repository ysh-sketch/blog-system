server.port=8082

# ==================== MySQL 数据库配置 ====================

# 数据库连接（稍后需要创建数据库）
spring.datasource.url=jdbc:mysql://localhost:3306/blog?useSSL=false&serverTimezone=UTC&characterEncoding=utf8&allowPublicKeyRetrieval=true
spring.datasource.username=bloguser
spring.datasource.password=blog123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==================== MyBatis 配置 ====================

# 数据库下划线命名 → Java 驼峰命名 自动转换
mybatis.configuration.map-underscore-to-camel-case=true

# 日志打印 SQL（调试用）
logging.level.com.example.blog.mapper=debug
